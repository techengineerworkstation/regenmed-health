<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="30%" style="stop-color:#0d9488"/>
      <stop offset="60%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="logoGradR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#0d9488;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hexClip">
      <polygon points="60,8 104,32 104,88 60,112 16,88 16,32"/>
    </clipPath>
  </defs>
  <!-- Outer glow ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.5"/>
  <circle cx="60" cy="60" r="52" fill="url(#logoGrad)" opacity="0.08"/>
  <!-- DNA helix paths -->
  <path d="M42,28 Q52,40 42,52 Q32,64 42,76 Q52,88 42,100" stroke="url(#logoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M78,28 Q68,40 78,52 Q88,64 78,76 Q68,88 78,100" stroke="url(#logoGradR)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Cross-links -->
  <line x1="44" y1="40" x2="76" y2="40" stroke="#0d9488" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="52" x2="80" y2="52" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
  <line x1="44" y1="64" x2="76" y2="64" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="76" x2="80" y2="76" stroke="#16a34a" stroke-width="1.5" opacity="0.4"/>
  <line x1="44" y1="88" x2="76" y2="88" stroke="#0d9488" stroke-width="1.5" opacity="0.4"/>
  <!-- Central heart/medical symbol -->
  <path d="M60,44 C55,44 48,48 48,56 C48,68 60,78 60,78 C60,78 72,68 72,56 C72,48 65,44 60,44Z"
        fill="url(#logoGrad)" filter="url(#logoGlow)"/>
  <!-- Medical cross inside heart -->
  <rect x="57" y="52" width="6" height="16" rx="1" fill="white" opacity="0.9"/>
  <rect x="52" y="57" width="16" height="6" rx="1" fill="white" opacity="0.9"/>
  <!-- Corner accent dots -->
  <circle cx="60" cy="12" r="3" fill="#16a34a" opacity="0.8"/>
  <circle cx="60" cy="108" r="3" fill="#7c3aed" opacity="0.8"/>
  <circle cx="12" cy="60" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="108" cy="60" r="3" fill="#06b6d4" opacity="0.8"/>
</svg>