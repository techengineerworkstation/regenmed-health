<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <radialGradient id="retinaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="40%" style="stop-color:#fde68a"/>
      <stop offset="80%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#92400e"/>
    </radialGradient>
    <radialGradient id="drusenGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef9c3"/>
      <stop offset="100%" style="stop-color="#eab308"/>
    </radialGradient>
    <linearGradient id="octBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Eye outline -->
  <ellipse cx="120" cy="100" rx="100" ry="70" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Retina background -->
  <ellipse cx="120" cy="100" rx="80" ry="55" fill="url(#retinaGrad)"/>
  <!-- Fovea (center) -->
  <circle cx="120" cy="100" r="12" fill="#92400e" opacity="0.6"/>
  <circle cx="120" cy="100" r="5" fill="#78350f" opacity="0.8"/>
  <!-- Drusen deposits -->
  <circle cx="100" cy="85" r="4" fill="url(#drusenGrad)" opacity="0.8"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="135" cy="80" r="5" fill="url(#drusenGrad)" opacity="0.7"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="145" cy="105" r="3.5" fill="url(#drusenGrad)" opacity="0.6"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="105" cy="110" r="4.5" fill="url(#drusenGrad)" opacity="0.75"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="128" cy="118" r="3" fill="url(#drusenGrad)" opacity="0.65"/>
  <!-- Blood vessels -->
  <path d="M40 100 Q80 95 120 100 Q160 105 200 95" stroke="#dc2626" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M50 110 Q90 100 120 100 Q150 100 190 90" stroke="#dc2626" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- OCT scan beam -->
  <rect x="118" y="20" width="4" height="160" fill="url(#octBeam)">
    <animate attributeName="y" values="20;30;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Labels -->
  <text x="10" y="30" font-size="8" fill="#64748b" font-family="sans-serif">OCT Beam</text>
  <text x="155" y="85" font-size="8" fill="#eab308" font-family="sans-serif">Drusen</text>
  <text x="145" y="135" font-size="8" fill="#78350f" font-family="sans-serif">Fovea</text>
</svg>
