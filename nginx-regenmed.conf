# HTTP server - no HSTS
server {
    listen 8081;
    server_name localhost;

    root /home/hptechworkpc/Apps/RegenMed;
    index index.php;
    charset utf-8;
    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(env|htaccess|git|svn) { deny all; }
    location ~* \.(json|lock|yml|yaml|toml|xml|sql|bak|config|dist|fla|inc|ini|psd|sh|swp|tpl|md|log)$ { deny all; }
    location ~ ^/(data|storage|includes|vendor|logs)/ { deny all; }
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(css|js)$ { expires 1M; add_header Cache-Control "public"; }

    location / {
        limit_req zone=regenmed burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/hptechworkpc.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=50M\npost_max_size=50M\nmax_execution_time=300\nmax_input_time=300\nsession.cookie_httponly=1\nsession.cookie_samesite=Strict";
        fastcgi_param HTTPS off;
    }

    location ~ ^/(data|storage|includes|logs)/.*\.php$ { deny all; }

    access_log /var/log/nginx/regenmed-access.log;
    error_log /var/log/nginx/regenmed-error.log;
}

# HTTPS server - with HSTS
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/regenmed.crt;
    ssl_certificate_key /etc/nginx/ssl/regenmed.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/hptechworkpc/Apps/RegenMed;
    index index.php;
    charset utf-8;
    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location ~ /\.(env|htaccess|git|svn) { deny all; }
    location ~* \.(json|lock|yml|yaml|toml|xml|sql|bak|config|dist|fla|inc|ini|psd|sh|swp|tpl|md|log)$ { deny all; }
    location ~ ^/(data|storage|includes|vendor|logs)/ { deny all; }
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(css|js)$ { expires 1M; add_header Cache-Control "public"; }

    location / {
        limit_req zone=regenmed burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/hptechworkpc.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=50M\npost_max_size=50M\nmax_execution_time=300\nmax_input_time=300\nsession.cookie_httponly=1\nsession.cookie_samesite=Strict";
        fastcgi_param HTTPS on;
    }

    location ~ ^/(data|storage|includes|logs)/.*\.php$ { deny all; }

    access_log /var/log/nginx/regenmed-access.log;
    error_log /var/log/nginx/regenmed-error.log;
}
