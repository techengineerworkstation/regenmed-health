<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Brain outline -->
  <path d="M80 20 C60 20 45 35 45 50 C45 60 50 68 55 72 C45 78 40 90 45 100 C50 110 60 115 70 112 C72 120 78 130 80 135 C82 130 88 120 90 112 C100 115 110 110 115 100 C120 90 115 78 105 72 C110 68 115 60 115 50 C115 35 100 20 80 20Z" fill="url(#brainGrad)" opacity="0.15" stroke="url(#brainGrad)" stroke-width="2"/>
  <!-- Neural connections -->
  <circle cx="60" cy="50" r="3" fill="#0d9488"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="45" r="3" fill="#06b6d4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="100" cy="50" r="3" fill="#4f46e5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="55" cy="75" r="3" fill="#06b6d4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="70" r="3.5" fill="#0d9488"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="105" cy="75" r="3" fill="#0d9488"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="100" r="3" fill="#4f46e5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="95" r="3" fill="#06b6d4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="100" cy="100" r="3" fill="#0d9488"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.2s" repeatCount="indefinite"/></circle>
  <!-- Connection lines -->
  <line x1="60" y1="50" x2="80" y2="45" stroke="#0d9488" stroke-width="0.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/></line>
  <line x1="80" y1="45" x2="100" y2="50" stroke="#06b6d4" stroke-width="0.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/></line>
  <line x1="55" y1="75" x2="80" y2="70" stroke="#0d9488" stroke-width="0.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="1s" repeatCount="indefinite"/></line>
  <line x1="80" y1="70" x2="105" y2="75" stroke="#4f46e5" stroke-width="0.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="1.5s" repeatCount="indefinite"/></line>
  <line x1="60" y1="100" x2="80" y2="95" stroke="#06b6d4" stroke-width="0.5" opacity="0.4"/>
  <line x1="80" y1="95" x2="100" y2="100" stroke="#0d9488" stroke-width="0.5" opacity="0.4"/>
</svg>
