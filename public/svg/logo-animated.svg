<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="aLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"><animate attributeName="stop-color" values="#16a34a;#0d9488;#06b6d4;#7c3aed;#16a34a" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" style="stop-color:#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#16a34a;#0d9488;#06b6d4;#7c3aed" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="aRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:0.6"><animate attributeName="stop-color" values="#16a34a;#0d9488;#7c3aed;#16a34a" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.6"><animate attributeName="stop-color" values="#7c3aed;#06b6d4;#16a34a;#7c3aed" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="aGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Animated outer ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#aRingGrad)" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="54;58;54" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="52" fill="url(#aLogoGrad)" opacity="0.08">
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- DNA helix -->
  <path d="M42,28 Q52,40 42,52 Q32,64 42,76 Q52,88 42,100" stroke="url(#aLogoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M78,28 Q68,40 78,52 Q88,64 78,76 Q68,88 78,100" stroke="url(#aLogoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- Cross-links pulse -->
  <line x1="44" y1="40" x2="76" y2="40" stroke="#0d9488" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/></line>
  <line x1="40" y1="52" x2="80" y2="52" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" begin="0.4s" repeatCount="indefinite"/></line>
  <line x1="44" y1="64" x2="76" y2="64" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="0.8s" repeatCount="indefinite"/></line>
  <line x1="40" y1="76" x2="80" y2="76" stroke="#16a34a" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" begin="1.2s" repeatCount="indefinite"/></line>
  <line x1="44" y1="88" x2="76" y2="88" stroke="#0d9488" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="1.6s" repeatCount="indefinite"/></line>
  <!-- Heart with pulse -->
  <path d="M60,44 C55,44 48,48 48,56 C48,68 60,78 60,78 C60,78 72,68 72,56 C72,48 65,44 60,44Z" fill="url(#aLogoGrad)" filter="url(#aGlow)">
    <animate attributeName="opacity" values="1;0.85;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <!-- Medical cross -->
  <rect x="57" y="52" width="6" height="16" rx="1" fill="white" opacity="0.9"/>
  <rect x="52" y="57" width="16" height="6" rx="1" fill="white" opacity="0.9"/>
  <!-- Corner dots pulse -->
  <circle cx="60" cy="12" r="3" fill="#16a34a" opacity="0.8"><animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="108" r="3" fill="#7c3aed" opacity="0.8"><animate attributeName="r" values="2;4;2" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="12" cy="60" r="3" fill="#0d9488" opacity="0.8"><animate attributeName="r" values="2;4;2" dur="1.5s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="108" cy="60" r="3" fill="#06b6d4" opacity="0.8"><animate attributeName="r" values="2;4;2" dur="1.5s" begin="1.5s" repeatCount="indefinite"/></circle>
</svg>