[regenmed]
user = hptechworkpc
group = hptechworkpc
listen = /run/php-fpm/hptechworkpc.sock
listen.owner = hptechworkpc
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Security
php_admin_value[expose_php] = Off
php_admin_flag[allow_url_fopen] = Off
php_admin_flag[allow_url_include] = Off

; Uploads
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 50M

; Timeouts
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300

; Sessions
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.use_strict_mode] = 1

; Logging
php_admin_flag[log_errors] = On
php_admin_value[error_log] = /home/hptechworkpc/Apps/RegenMed/logs/php-fpm-error.log
php_admin_value[session.save_path] = /home/hptechworkpc/Apps/RegenMed/data/sessions
